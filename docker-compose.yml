services:
  redis:
    image: redis:7-alpine
    container_name: snake-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - snake-net

  game-api:
    build:
      context: ./backend
    container_name: snake-game-api
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CORS_ORIGINS: "*"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/api/ready', timeout=2).status == 200 else sys.exit(1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - snake-net
    # Exposed to the host too, so you can hit http://localhost:8000/docs directly while developing
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: snake-frontend
    restart: unless-stopped
    depends_on:
      game-api:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - snake-net

networks:
  snake-net:
    driver: bridge

volumes:
  redis_data:
