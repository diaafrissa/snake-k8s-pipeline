# GitLab CI/CD pipeline: test -> build -> deploy
#
# Runner executor: Docker. Every job runs inside its own isolated container
# on the VPS, spun up and destroyed per job - not on the bare host shell.
#
# Two host resources are bind-mounted into every job container (configured
# once at runner registration time, see docs/DEPLOYMENT_CHECKLIST.md):
#   - /var/run/docker.sock  -> lets the "build" job use the VPS's own Docker
#                              engine to build images (no Docker-in-Docker
#                              needed, no --privileged required)
#   - kubeconfig file       -> lets the "deploy" job's kubectl reach the
#                              local k3s cluster
# Runner network_mode is set to "host" at registration, so containers share
# the VPS's network namespace and can reach the k3s API at 127.0.0.1:6443.

stages:
  - test
  - build
  - deploy

variables:
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/game-api
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  KUBECONFIG: /kube/config  # path where the runner mounts the host's kubeconfig

# ---------------------------------------------------------------------------
# Stage 1: run the pytest suite inside a clean python:3.12-slim container.
# ---------------------------------------------------------------------------
test:
  stage: test
  image: python:3.12-slim
  tags:
    - vps
  rules:
    - changes:
        - backend/**/*
  before_script:
    - cd backend
    - pip install -q -r requirements-dev.txt
  script:
    - pytest

# ---------------------------------------------------------------------------
# Stage 2: build both images using the VPS's own Docker engine (reached via
# the mounted docker.sock) and push to GitLab's Container Registry.
# ---------------------------------------------------------------------------
build:
  stage: build
  image: docker:27
  tags:
    - vps
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$BACKEND_IMAGE:latest" ./backend
    - docker push "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$BACKEND_IMAGE:latest"
    - docker build -t "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$FRONTEND_IMAGE:latest" ./frontend
    - docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$FRONTEND_IMAGE:latest"

# ---------------------------------------------------------------------------
# Stage 3: tell the already-running cluster to pull the new images.
# Uses alpine/k8s, a small image that ships kubectl out of the box.
# ---------------------------------------------------------------------------
deploy:
  stage: deploy
  image: alpine/k8s:1.30.2
  tags:
    - vps
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - kubectl set image deployment/game-api game-api="$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - kubectl set image deployment/frontend frontend="$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - kubectl rollout status deployment/game-api --timeout=120s
    - kubectl rollout status deployment/frontend --timeout=120s
  environment:
    name: production
