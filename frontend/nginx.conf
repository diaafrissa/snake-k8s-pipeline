server {
    listen 80;
    server_name snake-game.duckdns.org;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the game itself
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Reverse proxy to the game-api service.
    # This avoids CORS entirely: the browser only ever talks to this
    # single origin, and nginx forwards /api/* to the backend service
    # using its name as resolved by Docker/Kubernetes DNS.
    location /api/ {
        proxy_pass http://game-api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # Lightweight endpoint for container/K8s health checks on the frontend itself
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
