# ⚠️ SECURITY NOTE — read before committing this to Git:
#
# `stringData` here is a PLACEHOLDER for local/demo use only. Kubernetes
# Secrets are base64-ENCODED, not encrypted — anyone with `kubectl get
# secret -o yaml` access (or read access to this file in Git) can recover
# the real value instantly. Never commit real passwords in this file.
#
# Recommended real-world workflow instead:
#   kubectl create secret generic redis-secret \
#     --from-literal=REDIS_PASSWORD='<a-strong-generated-password>'
#
# That way the actual password never touches Git history at all.
# For a production/GitOps setup you'd go further with something like
# Sealed Secrets or SOPS - out of scope for this project, but good to
# know the next step exists.
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
type: Opaque
stringData:
  REDIS_PASSWORD: "change-me-before-applying"
