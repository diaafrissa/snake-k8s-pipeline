apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-api
  labels:
    app: game-api
spec:
  replicas: 2  
  selector:
    matchLabels:
      app: game-api
  template:
    metadata:
      labels:
        app: game-api
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: game-api
          image: registry.gitlab.com/diaa.frissan.1-group/snake-k8s-pipeline/game-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: snake-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: game-api
spec:
  selector:
    app: game-api
  ports:
    - port: 8000
      targetPort: 8000
