apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-api
  labels:
    app: game-api
spec:
  replicas: 2  # stateless (Redis holds the data) -> safe to run more than one
  selector:
    matchLabels:
      app: game-api
  template:
    metadata:
      labels:
        app: game-api
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: game-api
          # Replace YOUR-GROUP/YOUR-PROJECT with your actual GitLab namespace/path.
          # The CI pipeline pushes here automatically using $CI_REGISTRY_IMAGE,
          # and updates this exact tag on every deploy via `kubectl set image`.
          image: registry.gitlab.com/YOUR-GROUP/YOUR-PROJECT/game-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: snake-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          # Strict check - only receives traffic once Redis is actually reachable
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          # Lenient check - restarts the pod only if the process itself is stuck
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
